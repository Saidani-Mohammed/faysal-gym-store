<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        scroll-behavior: smooth;
        font-family: Arial, Helvetica, sans-serif;
        background-color: var(--maincolor);
    }
    :root{
        --maincolor : #0B0B0B;
        --secondarycolor : rgb(34, 34, 36);
        --brandcolor : #D4AF37;
    }
    .cart-page {
        min-height: 100dvh;
        background-color: var(--secondarycolor);
        color: white;
        padding: 30px 15px 50px;
    }
    .cart-page h1 {
        font-size: 28px;
        margin-bottom: 25px;
    }
    /* CART ITEM */
    .cart-item {
        display: flex;
        gap: 12px;
        background-color: #111;
        border: 1px solid #242424;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 12px;
    }
    /* Image */
    .cart-image {
        width: 100px;
        height: 100px;
        flex-shrink: 0;
        background-color: #f5f5f5;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .cart-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    /* Info */
    .cart-info {
        flex: 1;
        min-width: 0;
    }
    .cart-info h3 {
        font-size: 15px;
        margin: 3px 0 8px;
    }
    .cart-price {
        color: var(--brandcolor);
        font-weight: bold;
        margin-bottom: 12px;
    }
    /* QUANTITY */
    .cart-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .quantity {
        display: flex;
        align-items: center;
        border: 1px solid #333;
        border-radius: 5px;
        overflow: hidden;
    }
    .quantity button {
        width: 28px;
        height: 28px;
        border: none;
        background-color: #1c1c1c;
        color: white;
        cursor: pointer;
    }
    .quantity span {
        width: 30px;
        text-align: center;
    }
    /* Remove */
    .remove-btn {
        border: none;
        background: none;
        color: #777;
        cursor: pointer;
    }
    .remove-btn:hover {
        color: #ff4444;
    }
    /* SUMMARY */
    .cart-summary {
        background-color: #111;
        border: 1px solid #242424;
        border-radius: 10px;
        padding: 20px;
        margin-top: 30px;
    }
    .cart-summary h2 {
        font-size: 20px;
        margin-bottom: 20px;
    }
    .summary-row {
        display: flex;
        justify-content: space-between;
        color: #aaa;
        margin-bottom: 15px;
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #333;
        padding-top: 15px;
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
    }
    .summary-total span:last-child {
        color: var(--brandcolor);
    }
    /* Checkout */
    .checkout-btn {
        display: block;
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background-color: var(--brandcolor);
        color: #080808;
        text-align: center;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }
    @media (min-width: 768px) {
        .cart-page {
            max-width: 1200px;
            margin: auto;
            padding: 50px 30px;
        }
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: start;
        }
        .cart-summary {
            margin-top: 0;
            position: sticky;
            top: 20px;
        }
    }
    </style>
</head>
<body>
    <section class="cart-page">
        <h1>Your Cart</h1>
        <div class="cart-container">
            <div class="cart-items" id="cartItems">
                <!-- Products will be generated by JS -->
            </div>
            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">0 DA</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="delivery">500 DA</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">0 DA</span>
                </div>
                <a href="checkout.html" class="checkout-btn">
                    Proceed to Checkout
                </a>
            </div>
        </div>
    </section>
</body>
</html>
